name: go

# ★ push 에는 paths 필터를 걸지 않는다 (2026-08-15 실측).
#   브랜치를 **처음 만드는 push** 에서는 비교 기준(before)이 0000... 이라 GitHub 이
#   변경 파일을 못 구하고, 그러면 잡이 아예 안 돈다. "빨간불" 보다 나쁜 게 "안 돈 줄 모르는 것" 이다.
#   PR 에서는 필터가 정상 동작하므로 그쪽만 남긴다.
on:
  push:
  pull_request:
    # ★ ui/** 도 포함한다 — 대시보드가 바이너리에 embed 되므로 UI 변경은 Go 빌드 산출물을 바꾼다.
    paths:
      ["**.go", "go.mod", "go.sum", "scripts/**", "ui/**", ".github/workflows/go.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go test ./... -race

  # ★ 크로스컴파일이 Go 를 고른 유일한 결정타다. 그게 깨지면 배포 전략이 통째로 깨지므로
  #   CI 가 매번 확인한다 (맥 ARM 빌드머신을 사지 않기 위한 전제).
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe 용
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # 대시보드는 매 빌드마다 새로 짓는다 (산출물을 커밋하지 않으므로 npm 이 필수다).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: ./scripts/build.sh cross
      - name: 버전 스탬프 확인
        run: |
          # sha 가 비면 "업데이트했는데 옛 코드" 드리프트 감지가 죽는다.
          out=$(./bin/cockpitd-linux-amd64 --version)
          echo "$out"
          if echo "$out" | grep -q "unknown"; then
            echo "sha 가 비었다 — 드리프트 감지가 죽는다"
            exit 1
          fi
      # ★ "빌드가 통과했다" 와 "화면이 실제로 뜬다" 는 다른 말이다. embed 가 비어도,
      #   토큰 주입이 깨져도 Go 빌드는 초록이다 — 그래서 진짜 바이너리를 띄워 눈으로 볼 것을 본다.
      - name: 대시보드가 바이너리에서 실제로 뜨는지
        run: |
          ./bin/cockpitd-linux-amd64 --port 7738 --data-dir "$RUNNER_TEMP/cockpit" &
          pid=$!
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:7738/ && break
            sleep 0.5
          done
          body=$(curl -s http://127.0.0.1:7738/ || true)
          kill $pid || true
          echo "$body" | grep -q "assets/" \
            || { echo "UI 산출물이 안 박혔다 (npm 빌드가 건너뛰어졌나)"; exit 1; }
          echo "$body" | grep -q "window.__COCKPIT__" \
            || { echo "부팅 정보 주입 실패 — 화면은 뜨지만 모든 API 호출이 401 이 된다"; exit 1; }
